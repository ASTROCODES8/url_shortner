<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capsulink | Custom Short Links</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="url.css">
</head>
<body>

    <main class="container">
        <section class="shortener">
            <h1 class="shortener__title">Create Short Link</h1>
            <form class="shortener__form" id="shorten-form">
                <div class="input-container">
                    <input type="url" placeholder="Paste a link to shorten it!" class="shortener__input" id="url-input" required>
                    <span class="error-message" id="error-message"></span>
                </div>
                <button type="submit" class="btn btn--primary">Shorten</button>
            </form>
        </section>

        <section class="links" id="links-container">
        </section>

    </main>
    <script src="url.js"></script>

</body>
</html>
